<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="研来 Yanlai">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c31"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="ink" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="42%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.16" r="0.85">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.10"/>
    </pattern>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="tile">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#grid)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#glow)"/>
  </g>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="111.5" fill="none" stroke="#7dd3fc" stroke-opacity="0.20" stroke-width="1.5"/>

  <!-- orbit accent -->
  <circle cx="256" cy="252" r="150" fill="none" stroke="#22d3ee" stroke-opacity="0.13" stroke-width="1.6" stroke-dasharray="4 12"/>
  <circle cx="406" cy="252" r="7" fill="#22d3ee" opacity="0.7"/>

  <!-- glowing underlay of the Y -->
  <g filter="url(#soft)" opacity="0.55">
    <path d="M150 165 L256 264 L362 165" fill="none" stroke="#22d3ee" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 264 L256 396" fill="none" stroke="#a78bfa" stroke-width="34" stroke-linecap="round"/>
  </g>

  <!-- the Y mark: two arms converging into a stem, reading as 研来 + an upward graph -->
  <path d="M150 165 L256 264 L362 165" fill="none" stroke="url(#ink)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M256 264 L256 396" fill="none" stroke="url(#ink)" stroke-width="30" stroke-linecap="round"/>

  <!-- nodes: three knowledge points -->
  <g>
    <circle cx="150" cy="165" r="21" fill="#0b1220"/>
    <circle cx="150" cy="165" r="15" fill="#7dd3fc"/>
    <circle cx="362" cy="165" r="21" fill="#0b1220"/>
    <circle cx="362" cy="165" r="15" fill="#c4b5fd"/>
    <circle cx="256" cy="396" r="21" fill="#0b1220"/>
    <circle cx="256" cy="396" r="15" fill="#22d3ee"/>
  </g>

  <!-- book/base bar: the desk the curve stands on -->
  <rect x="132" y="418" width="248" height="17" rx="8.5" fill="url(#base)"/>
</svg>
