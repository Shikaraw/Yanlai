name: Release

# Builds the Windows installers on GitHub's runners and publishes them to a
# Release.
#
# Why this runs here instead of on the maintainer's machine:
#   1. The development machine cannot reach api.github.com at all (mainland
#      network, and the local proxy's upstream node is down).
#   2. The public GitHub mirrors that DO work replace the Authorization header
#      with their own account token — verified by sending a bogus token and
#      getting the mirror's own login back. So authenticated writes are
#      impossible through them.
# Running on a GitHub runner uses the automatic GITHUB_TOKEN; no personal access
# token is involved.
#
# Asset filenames are intentionally ASCII (Yanlai-1.0.00-Setup-x64.exe).
# Verified: GitHub's "update a release asset" endpoint returns 404 for
# non-ASCII filenames, which aborted the first publish attempt. The app maps
# these names to Chinese labels for display.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的 tag（如 v1.0.00）'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本号: $V"

      - name: 校验 tag 与 package.json 版本
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          EXPECTED="v${{ steps.ver.outputs.version }}"
          if [ "$RELEASE_TAG" != "$EXPECTED" ]; then
            echo "::error::tag ($RELEASE_TAG) 必须严格匹配 package.json ($EXPECTED)"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - name: 安装依赖
        run: npm ci --no-audit --no-fund
        env:
          # runner 可直连，覆盖仓库 .npmrc 里的国内镜像
          npm_config_registry: https://registry.npmjs.org
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: 类型检查
        run: npm run typecheck

      - name: 测试
        run: npm test

      - name: 构建前端
        run: npm run build

      - name: 打包安装程序
        run: npx electron-builder --win --x64 --publish never
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 确认产物
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          test -s "release/Yanlai-${V}-Setup-x64.exe"
          test -s "release/Yanlai-${V}-Portable-x64.exe"
          sha256sum "release/Yanlai-${V}-Setup-x64.exe" "release/Yanlai-${V}-Portable-x64.exe"

      # gh CLI is preinstalled on GitHub runners and handles asset upload far
      # more robustly than the third-party release action (which failed on the
      # second asset during the first attempt).
      - name: 创建 Release 并上传
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          V="${{ steps.ver.outputs.version }}"
          NOTES=$(cat <<EOF
          ## 研来 v${V}

          ### v2 新功能

          - 仪表盘专注监测与切屏记录，支持本地日期统计和学习状态恢复。
          - 多方案计划库与跨夜学习调度；支持场景复制、提醒暂停与持久化。
          - CleverCalculator 本地符号计算：表达式、微积分、矩阵与微分方程，无需网络或系统 Python。
          - 完整键盘输入、条件区、结果复制到对话与本次会话历史。
          - 项目所有者已授权 CleverCalculator 集成源码与程序公开发布；未推定 MIT 或其他宽松项目许可，第三方许可与声明保留。

          ### 下载

          | 文件 | 说明 |
          |---|---|
          | \`Yanlai-${V}-Setup-x64.exe\` | **安装版** —— 带开始菜单与桌面快捷方式，可选择安装目录 |
          | \`Yanlai-${V}-Portable-x64.exe\` | **免安装版** —— 双击即用，不写注册表 |

          > 覆盖安装即可升级；你的对话、错题、知识与卡片都会保留。

          ### 首次使用

          1. 启动后进入 **设置 → 模型与 API**，填入 Base URL、API Key 与模型名
          2. 点「测试连接」确认可用
          3. 想用截图讲题，请选择支持视觉的模型（gpt-4o / qwen-vl-max / glm-4v 等）

          想完全免费可装 [Ollama](https://ollama.com)，Base URL 填 \`http://127.0.0.1:11434/v1\`，Key 留空即可。

          详见 [使用手册](https://github.com/${{ github.repository }}/blob/main/docs/USAGE.md)。
          EOF
          )

          # Never delete or overwrite an existing public release or asset on rerun.
          # Add only missing assets so a partial upload can be recovered safely.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            for ASSET in "Yanlai-${V}-Setup-x64.exe" "Yanlai-${V}-Portable-x64.exe"; do
              if ! gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET"; then
                gh release upload "$TAG" "release/$ASSET" --repo "${{ github.repository }}"
              fi
            done
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "研来 v${V}" \
              --notes "$NOTES" \
              --verify-tag \
              release/Yanlai-"${V}"-Setup-x64.exe \
              release/Yanlai-"${V}"-Portable-x64.exe
          fi

          echo "已发布 Release $TAG"

      - name: 校验 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          V="${{ steps.ver.outputs.version }}"
          gh release view "$TAG" --repo "${{ github.repository }}" --json tagName,isDraft,assets > release/published.json
          node -e 'const fs = require("fs"); const r = JSON.parse(fs.readFileSync("release/published.json")); const v = process.argv[1]; if (r.tagName !== `v${v}` || r.isDraft) throw Error("Release is not public or tag differs"); for (const kind of ["Setup", "Portable"]) { const name = `Yanlai-${v}-${kind}-x64.exe`; const a = r.assets.find(a => a.name === name); if (!a || a.size <= 0) throw Error(`Missing/empty asset: ${name}`); console.log(`${name}: ${a.size} bytes`); }' "$V"
          gh release view "$TAG" --repo "${{ github.repository }}" --json tagName,name,assets \
            --template '{{.tagName}} | {{.name}}{{"\n"}}{{range .assets}}  asset: {{.name}} ({{.size}} bytes){{"\n"}}{{end}}'
